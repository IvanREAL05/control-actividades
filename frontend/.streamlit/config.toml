[theme]
# Tema fijo en claro: la app se ve igual sin importar si el usuario tiene
# modo oscuro activado en su sistema operativo. Antes, sin este archivo,
# Streamlit usaba el tema del SO y el CSS propio (pensado para fondo claro)
# quedaba ilegible sobre el tema oscuro nativo.
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f9fafb"
textColor = "#1f2937"
font = "sans serif"
